# Theme: catppuccin-mocha
# Nguồn sự thật giao diện hợp nhất (Universal Appearance Schema)
# Hex KHÔNG có dấu '#'

# --- 1. Mode & Palette Core ---
MODE=dark
BG=1e1e2e
FG=cdd6f4
ACCENT=cba6f7    # Mauve
SURFACE=313244   # Surface 0
BORDER=cba6f7

COLOR0=45475a    # black       (Surface 1)
COLOR1=f38ba8    # red         (Red)
COLOR2=a6e3a1    # green       (Green)
COLOR3=f9e2af    # yellow      (Yellow)
COLOR4=89b4fa    # blue        (Blue)
COLOR5=cba6f7    # magenta     (Mauve)
COLOR6=89dceb    # cyan        (Sky)
COLOR7=bac2de    # white       (Subtext 1)
COLOR8=585b70    # bright black (Surface 2)
COLOR9=f38ba8    # bright red
COLOR10=a6e3a1   # bright green
COLOR11=f9e2af   # bright yellow
COLOR12=89b4fa   # bright blue
COLOR13=cba6f7   # bright magenta
COLOR14=94e2d5   # bright cyan  (Teal)
COLOR15=a6adc8   # bright white (Subtext 0)

# --- 2. Typography ---
FONT_UI="Inter"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=11

# --- 3. Cursors & System Icons ---
CURSOR_THEME="Adwaita"
CURSOR_SIZE=16
ICON_THEME="Papirus-Dark"

# --- 4. Metrics & HiDPI Scaling ---
XFT_DPI=96
GDK_SCALE=1
