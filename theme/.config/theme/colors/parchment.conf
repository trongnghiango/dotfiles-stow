# Theme: parchment
# Phong cách giấy cũ màu vàng nhạt (Aged Parchment / Vintage Warm Paper)
# Nguồn sự thật màu sắc — hex KHÔNG có dấu '#'
# Sửa ở đây, rồi chạy: theme-set parchment

MODE=light
GTK_THEME=Arc

BG=f5ecd7        # Màu giấy cũ ngả vàng nhạt ấm, dịu mắt
FG=3c3228        # Mực nâu đen cổ điển (sepia charcoal ink)

COLOR0=eadebe    # Nền giấy hơi đậm / DWM bar bg
COLOR1=af3029    # Đỏ son cổ / mực dấu niêm phong (crimson wax)
COLOR2=5b7a3a    # Xanh lá rêu cổ điển (sage / olive)
COLOR3=b57614    # Vàng đất son / hổ phách (ochre amber)
COLOR4=2b6682    # Xanh chàm / mực viết cổ (indigo blue)
COLOR5=8a466a    # Tím mận nhạt (dusty plum)
COLOR6=3c3228    # Màu chữ thanh trạng thái DWM (mực nâu đen)
COLOR7=3c3228    # Màu mực viết

COLOR8=c8bfa6    # Viền cửa sổ inactive / màu nếp gấp giấy
COLOR9=c24838    # Đỏ son tươi
COLOR10=6f9146   # Xanh lá mạ
COLOR11=d48817   # Vàng đất sáng
COLOR12=3d7f9e   # Xanh chàm sáng
COLOR13=a3557e   # Tím hoa cà
COLOR14=8f4e1c   # Nền tag được chọn trên DWM (nâu da bò cổ)
COLOR15=fbf6ea   # Trắng ngà điểm sáng (bright paper highlight)

ACCENT=b56a28    # Viền active, rofi selected (nâu hổ phách ấm)
