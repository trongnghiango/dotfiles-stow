# Theme: parchment
# Nguồn sự thật giao diện hợp nhất (Universal Appearance Schema)
# Phong cách giấy cũ màu vàng nhạt (Aged Parchment / Vintage Warm Paper)
# Hex KHÔNG có dấu '#'

# --- 1. Mode & Palette Core ---
MODE=light
BG=f5ecd7        # Màu giấy cũ ngả vàng nhạt ấm
FG=3c3228        # Mực nâu đen cổ điển
ACCENT=b56a28    # Nâu hổ phách ấm
SURFACE=eadebe   # Nền giấy hơi đậm
BORDER=b56a28

COLOR0=eadebe    # Nền giấy hơi đậm
COLOR1=af3029    # Đỏ son cổ
COLOR2=5b7a3a    # Xanh lá rêu cổ
COLOR3=b57614    # Vàng đất son
COLOR4=2b6682    # Xanh chàm
COLOR5=8a466a    # Tím mận nhạt
COLOR6=3c3228    # Nâu đen
COLOR7=3c3228    # Màu mực viết
COLOR8=c8bfa6    # Viền inactive
COLOR9=c24838    # Đỏ son tươi
COLOR10=6f9146   # Xanh lá mạ
COLOR11=d48817   # Vàng đất sáng
COLOR12=3d7f9e   # Xanh chàm sáng
COLOR13=a3557e   # Tím hoa cà
COLOR14=8f4e1c   # Nền tag được chọn
COLOR15=fbf6ea   # Trắng ngà điểm sáng

# --- 2. Typography ---
FONT_UI="Inter"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=11

# --- 3. Cursors & System Icons ---
CURSOR_THEME="Adwaita"
CURSOR_SIZE=16
ICON_THEME="Papirus"

# --- 4. Metrics & HiDPI Scaling ---
XFT_DPI=96
GDK_SCALE=1
