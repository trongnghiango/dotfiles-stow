# ==============================================================================
# Brave Browser Flags — ThinkPad X230 (Intel HD 4000 / Ivy Bridge) + X11
# ==============================================================================
# File này được quản lý bởi GNU Stow (~/.dotfiles/brave/.config/brave-flags.conf)
# Brave đọc file này tự động khi khởi động.
# Thay đổi có hiệu lực sau khi restart Brave.
# ==============================================================================

# --- X11 Backend ---
# Dùng X11 thuần, không Ozone/Wayland
--ozone-platform=x11

# --- GPU Rendering (Mesa + HD4000) ---
# Dùng OpenGL desktop context thay vì EGL
# EGL đôi khi gây lỗi EGL_BAD_ALLOC hoặc màn hình đen trên HD4000/Mesa
--use-gl=desktop

# GPU rasterization: chuyển rasterization sang GPU, giảm tải CPU x230
--enable-gpu-rasterization

# Zero-copy: tránh copy buffer giữa GPU và CPU (tiết kiệm memory bandwidth)
--enable-zero-copy

# Số raster threads — X230 có 2 cores (4 threads HT), dùng 2 là tối ưu
--num-raster-threads=2

# --- Hardware Video Decode (VA-API) ---
# Intel HD 4000 hỗ trợ H.264 và VP8 qua VA-API
# Bật để giảm CPU khi xem video YouTube
--enable-features=VaapiVideoDecoder
--enable-accelerated-video-decode

# --- Network ---
# HTTP/3 / QUIC: giảm latency cho sites hỗ trợ (Google, YouTube...)
--enable-quic

# --- Memory & Process ---
# Chạy Network Service trong browser process → tiết kiệm ~50MB RAM
--enable-features=NetworkServiceInProcess2

# --- Tắt các feature không cần / gây lỗi ---
# ChromeOS video decoder không tương thích trên Linux thường
--disable-features=UseChromeOSDirectVideoDecoder

# --- IME / Input (fcitx5 X11) ---
# GTK4 input method cho fcitx5 hoạt động đúng với tiếng Việt
--gtk-version=4

# --- Password Store ---
# Dùng basic store thay vì gnome-keyring để tránh popup mỗi lần mở Brave
--password-store=basic
