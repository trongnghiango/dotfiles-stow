# ==============================================================================
# BRAVE BROWSER FLAGS — WAYLAND PROFILE
# ==============================================================================
# Location: ~/.config/brave-flags.conf, brave-origin-flags.conf & helium-browser-flags.conf (Managed via Stow)
# NOTE: --enable-gpu-rasterization and --ignore-gpu-blocklist are intentionally
# omitted — they cause black screen on video with ANGLE+Wayland (Mesa 26+).
# ==============================================================================

# 1. Native Wayland & IME
--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-wayland-ime

# 2. GL Backend — force native OpenGL (Mesa) instead of ANGLE
# Fixes: eglCreateImage EGL_BAD_ALLOC (0x3009) on Intel+NVIDIA hybrid Wayland
# ANGLE defaults to NVIDIA EGL, can't import Intel DMA-BUF from Hyprland compositor
--use-gl=desktop

--enable-features=TouchpadOverscrollHistoryNavigation,CanvasOopRasterization,ParallelDownloading
--enable-quic
--enable-smooth-scrolling

# 3. Password Store (Omarchy GNOME Keyring)
--password-store=gnome-libsecret

# 4. Omarchy Extensions (URL Copier, YT-DLP, WhatsApp)
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
