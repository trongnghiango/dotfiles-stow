# ==============================================================================
# BRAVE BROWSER FLAGS — ULTRA-PERFORMANCE WAYLAND & GPU PROFILE
# ==============================================================================
# Location: ~/.config/brave-flags.conf (Managed via Stow)
# ==============================================================================

# 1. Native Wayland & IME
--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-wayland-ime

# 2. GPU Hardware Acceleration & Zero-Copy Rasterization
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist

# 3. High-Performance Web Features (HTTP/3, Parallel Download, VA-API)
--enable-features=TouchpadOverscrollHistoryNavigation,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,CanvasOopRasterization,ParallelDownloading
--enable-quic
--enable-smooth-scrolling

# 4. Password Store (Omarchy GNOME Keyring)
--password-store=gnome-libsecret

# 5. Omarchy Extensions (URL Copier, YT-DLP, WhatsApp)
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
