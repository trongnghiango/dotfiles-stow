# ==============================================================================
# Picom Compositor — Low-Latency cho ThinkPad X230 (Intel HD 4000)
# Triết lý: Chống xé hình (vsync), KHÔNG blur, KHÔNG fading
# ==============================================================================

backend = "glx";
vsync = true;
use-damage = true;

# Intel HD 4000 / Ivy Bridge GLX Performance Tuning
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;

# Blur tắt hoàn toàn — triết lý Low-Latency
blur: {
  method = "none";
};

corner-radius = 0;

# Shadow nhẹ — tăng nhận diện cửa sổ nổi mà hiệu năng tối thiểu
shadow = true;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.5;

shadow-exclude = [
  "class_g = 'slop'",
  "class_g = 'dwm'",
  "class_g = 'dwmsystray'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@"
];

# Fading tắt — giảm độ trễ xuất hiện/biến mất cửa sổ
fading = false;
