backend = "glx";
vsync = true;

use-damage = true;

blur: {
  method = "dual_kawase";
  strength = 6;
  background = false;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "class_g = 'slop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'"
];

corner-radius = 0;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.7;

shadow-exclude = [
  "class_g = 'slop'",
  "class_g = 'dwm'",
  "class_g = 'dwmsystray'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
