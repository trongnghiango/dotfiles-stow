# Profile: thinkpad-x230 (Chuyên biệt cho Lenovo ThinkPad X230)
PROFILE_NAME="thinkpad-x230"
CHASSIS_TYPE="laptop"
GPU_VENDOR="intel"
GPU_MODEL="HD4000"
DISPLAY_DPI=96
DISPLAY_SUBPIXEL="rgb"
TOUCHPAD_ENABLED=1
BATTERY_ENABLED=1
BATTERY_THRESHOLDS="50-60"
BACKLIGHT_CONTROL=1
PICOM_BACKEND="glx"
AUDIO_BACKEND="alsa"
DEFAULT_BROWSER="firefox-esr"
CPU_GOVERNOR="powersave"

# Tối ưu hóa Driver Mesa cho Intel HD 4000 (Ivy Bridge Gen 7)
# Driver crocus thay thế i965: cải thiện pipeline render OpenGL, DRI3 và triệt tiêu micro-stutter
MESA_LOADER_DRIVER_OVERRIDE="crocus"
LIBGL_DRI3_ENABLE="1"
