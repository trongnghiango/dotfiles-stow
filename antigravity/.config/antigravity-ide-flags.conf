# ==============================================================================
# ANTIGRAVITY IDE FLAGS — WAYLAND & HYBRID GPU PROFILE
# ==============================================================================
# Location: ~/.config/antigravity-ide-flags.conf (Managed via GNU Stow)
# Fixes: Stutter, high CPU software rendering, and latency on Intel+NVIDIA Wayland
# ==============================================================================

# 1. Native Wayland & IME
--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-wayland-ime

# 2. GL Backend — Force native OpenGL (Mesa Intel UHD) instead of ANGLE
# Prevents EGL allocation errors with Hyprland compositor
--use-gl=desktop
--gpu-preference=low-power

# 3. Hardware Acceleration & Fluid Scrolling
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=TouchpadOverscrollHistoryNavigation,CanvasOopRasterization
