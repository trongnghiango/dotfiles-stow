# ==============================================================================
# PIPEWIRE RNNOISE REAL-TIME NOISE CANCELLATION CONFIGURATION (STEREO)
# ==============================================================================
# Package: pipewire (dotfiles stow package)
# Target: ~/.config/pipewire/pipewire.conf.d/99-input-denoising.conf
#
# Uses official PipeWire filter-chain configuration with:
# - noise_suppressor_stereo LADSPA label (True Stereo processing: FL + FR)
# - Audio/Source media class for global system microphone capture
# - Priority 2500 for automatic default selection
# ==============================================================================

context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Noise Canceling Source"
      media.name       = "Noise Canceling Source"
      filter.graph = {
        nodes = [
          {
            type    = ladspa
            name    = rnnoise
            plugin  = librnnoise_ladspa
            label   = noise_suppressor_stereo
            control = {
              "VAD Threshold (%)"        = 50.0
              "VAD Grace Period (ms)"    = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      audio.position = [ FL FR ]
      capture.props = {
        node.name    = "capture.rnnoise_source"
        node.passive = true
      }
      playback.props = {
        node.name        = "rnnoise_source"
        media.class      = Audio/Source
        priority.driver  = 2500
        priority.session = 2500
      }
    }
  }
]
