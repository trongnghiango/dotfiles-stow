<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141c"/>
    </radialGradient>
    
    <!-- Vinyl Grooves Gradient -->
    <linearGradient id="vinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="50%" stop-color="#191a21"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>

    <!-- Glowing Accent Gradient (Omarchy / Dracula / Neon Blue-Purple) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="80%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#b000ff"/>
    </linearGradient>

    <!-- Center Label Gradient -->
    <linearGradient id="center-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="600" height="600" rx="36" fill="url(#bg)"/>

  <!-- Outer Ambient Neon Ring -->
  <circle cx="300" cy="270" r="185" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6" filter="url(#neon-glow)"/>

  <!-- Vinyl Record Disc -->
  <circle cx="300" cy="270" r="180" fill="url(#vinyl)" stroke="#383a59" stroke-width="2"/>
  
  <!-- Vinyl Grooves -->
  <circle cx="300" cy="270" r="160" fill="none" stroke="#282a36" stroke-width="2" stroke-dasharray="16 4 32 8" opacity="0.8"/>
  <circle cx="300" cy="270" r="140" fill="none" stroke="#383a59" stroke-width="1.5" stroke-dasharray="40 10" opacity="0.6"/>
  <circle cx="300" cy="270" r="120" fill="none" stroke="#282a36" stroke-width="2" stroke-dasharray="24 6" opacity="0.7"/>
  <circle cx="300" cy="270" r="100" fill="none" stroke="#383a59" stroke-width="1.5" opacity="0.5"/>

  <!-- Vinyl Center Label -->
  <circle cx="300" cy="270" r="75" fill="#1e1f29" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="300" cy="270" r="70" fill="url(#center-label)" opacity="0.2"/>

  <!-- Music Notes / Waveform Graphic in Center -->
  <g fill="url(#accent)" filter="url(#neon-glow)">
    <!-- High-res Note icon -->
    <path d="M 285 220 L 335 205 C 339 204 343 207 343 211 L 343 282 A 22 22 0 1 1 318 262 L 318 235 L 285 245 L 285 298 A 22 22 0 1 1 260 278 L 260 226 C 260 222 264 219 268 219 Z"/>
  </g>

  <!-- Center Spindle Hole -->
  <circle cx="300" cy="270" r="12" fill="#13141c" stroke="#44475a" stroke-width="2"/>

  <!-- Equalizer / Waveform Graphic Bars at Bottom -->
  <g transform="translate(180, 480)" fill="url(#accent)" opacity="0.85">
    <rect x="0" y="-12" width="6" height="24" rx="3"/>
    <rect x="16" y="-24" width="6" height="48" rx="3"/>
    <rect x="32" y="-36" width="6" height="72" rx="3"/>
    <rect x="48" y="-18" width="6" height="36" rx="3"/>
    <rect x="64" y="-30" width="6" height="60" rx="3"/>
    <rect x="80" y="-42" width="6" height="84" rx="3"/>
    <rect x="96" y="-20" width="6" height="40" rx="3"/>
    <rect x="112" y="-38" width="6" height="76" rx="3"/>
    <rect x="128" y="-48" width="6" height="96" rx="3"/>
    <rect x="144" y="-32" width="6" height="64" rx="3"/>
    <rect x="160" y="-16" width="6" height="32" rx="3"/>
    <rect x="176" y="-40" width="6" height="80" rx="3"/>
    <rect x="192" y="-28" width="6" height="56" rx="3"/>
    <rect x="208" y="-44" width="6" height="88" rx="3"/>
    <rect x="224" y="-22" width="6" height="44" rx="3"/>
    <rect x="240" y="-10" width="6" height="20" rx="3"/>
  </g>

  <!-- Bottom Label -->
  <text x="300" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#a9b1d6" text-anchor="middle" letter-spacing="4" opacity="0.9">AUDIO PLAYBACK</text>
</svg>