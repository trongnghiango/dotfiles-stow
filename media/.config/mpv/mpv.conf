# ==============================================================================
# MPV CONFIGURATION — WAYLAND & PIPEWIRE HARDWARE ACCELERATION
# ==============================================================================
# File: ~/.config/mpv/mpv.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. VIDEO OUTPUT & HARDWARE DECODING
# ------------------------------------------------------------------------------
# Native Wayland video output & modern GPU rendering
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe

# High quality scaling
scale=spline36
cscale=spline36
dscale=mitchell

# ------------------------------------------------------------------------------
# 2. GENERAL & PLAYBACK BEHAVIOR
# ------------------------------------------------------------------------------
# Remember playback position when quitting
save-position-on-quit=yes

# Keep the player open after the video finishes
keep-open=yes

# Default window behavior
autofit-larger=80%x80%
autofit-smaller=30%x30%
no-border

# OSD (On-Screen Display) styling
osd-font="sans-serif"
osd-font-size=24
osd-duration=2000
osd-bar=no

# ------------------------------------------------------------------------------
# 3. AUDIO (PipeWire optimized)
# ------------------------------------------------------------------------------
ao=pipewire,pulse,alsa
volume=100
volume-max=150
audio-channels=stereo

# ------------------------------------------------------------------------------
# 4. SUBTITLES & SCREENSHOTS
# ------------------------------------------------------------------------------
# Subtitles
sub-auto=fuzzy
sub-font="sans-serif"
sub-font-size=36
sub-border-size=2
sub-color="#FFFFFFFF"
sub-border-color="#000000B0"

# Screenshots (Save to ~/Pictures/Screenshots/mpv)
screenshot-format=png
screenshot-png-compression=8
screenshot-template="~/Pictures/Screenshots/mpv/mpv_%F_%p"
