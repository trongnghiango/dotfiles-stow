# ==============================================================================
# DESKTOP SESSION REAL-TIME PRIORITIZATION
# ==============================================================================
# Location: ~/.config/systemd/user/session.slice.d/10-priority.conf
# Managed via: GNU Stow (systemd package)
#
# Ensures Hyprland (Wayland Compositor), PipeWire (Audio), and UI services
# always receive high CPU & I/O priority over background builds or video renders.
# ==============================================================================

[Slice]
CPUWeight=1000
IOWeight=1000
