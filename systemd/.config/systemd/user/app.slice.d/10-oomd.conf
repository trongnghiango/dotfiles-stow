# ==============================================================================
# APP SLICE OOM TUNING — WORKSTATION PROFILE
# ==============================================================================
# Location: ~/.config/systemd/user/app.slice.d/10-oomd.conf
# Managed via: GNU Stow (systemd package)
# Overrides: /usr/lib/systemd/user/app.slice.d/10-oomd.conf (omarchy-settings)
#
# Prevents systemd-oomd from prematurely killing IDE, compilers, or renderers
# due to transient CPU/RAM pressure spikes (PSI). Keeps swap backstop (>90%).
# ==============================================================================

[Slice]
ManagedOOMMemoryPressure=never
ManagedOOMSwap=kill
