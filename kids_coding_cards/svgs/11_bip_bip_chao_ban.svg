<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="350" height="500">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <!-- Outer Card Background with Rounded Corner -->
    <rect x="15" y="15" width="320" height="470" rx="28" fill="#FEF9E7" stroke="#D68910" stroke-width="7" filter="url(#shadow)"/>
    
    <!-- Inner dashed border (guide for child / friendly look) -->
    <rect x="25" y="25" width="300" height="450" rx="20" fill="none" stroke="#D68910" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

    <!-- Top Category Badge -->
    <g transform="translate(175, 52)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#F39C12"/>
        <text x="0" y="5" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ÂM THANH ROBOT</text>
    </g>

    <!-- Main Title -->
    <text x="175" y="105" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#7E5109" text-anchor="middle">BÍP BÍP! CHÀO BẠN</text>

    <!-- Subtitle (Small helper for parents) -->
    <text x="175" y="128" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7F8C8D" text-anchor="middle">Phát ra tiếng kêu vui nhộn</text>

    <!-- Center Illustration Area -->
    <g id="illustration">
        
            <g transform="translate(175, 225)">
                <!-- Megaphone / Speaker -->
                <path d="M -40,-20 L -15,-20 L 25,-55 L 25,55 L -15,20 L -40,20 Z" fill="#3498DB" stroke="#2471A3" stroke-width="5" stroke-linejoin="round"/>
                <rect x="-55" y="-15" width="15" height="30" rx="4" fill="#BDC3C7"/>
                <!-- Sound waves -->
                <path d="M 40,-30 Q 60,0 40,30" fill="none" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
                <path d="M 55,-48 Q 85,0 55,48" fill="none" stroke="#F39C12" stroke-width="7" stroke-linecap="round"/>
                <!-- Text Bubble "BÍP BÍP!" -->
                <rect x="-60" y="70" width="120" height="32" rx="16" fill="#F39C12"/>
                <text x="0" y="92" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">BÍP BÍP ~♪</text>
            </g>
        
    </g>

    <!-- Bottom Decorative Floor Tile Grid Hint -->
    <g transform="translate(175, 435)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#D68910" stroke-width="2" opacity="0.8"/>
        <!-- 3 small floor tile squares -->
        <rect x="-35" y="-7" width="14" height="14" rx="2" fill="#F39C12" opacity="0.4"/>
        <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#F39C12"/>
        <rect x="21" y="-7" width="14" height="14" rx="2" fill="#F39C12" opacity="0.4"/>
    </g>
    
    <!-- Little footprint footer -->
    <text x="175" y="470" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#95A5A6" text-anchor="middle" letter-spacing="1">KHU VƯỜN LẬP TRÌNH TÍ HON</text>
</svg>
