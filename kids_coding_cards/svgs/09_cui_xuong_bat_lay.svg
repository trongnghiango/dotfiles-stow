<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="350" height="500">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <!-- Outer Card Background with Rounded Corner -->
    <rect x="15" y="15" width="320" height="470" rx="28" fill="#FEF9E7" stroke="#D68910" stroke-width="7" filter="url(#shadow)"/>
    
    <!-- Inner dashed border (guide for child / friendly look) -->
    <rect x="25" y="25" width="300" height="450" rx="20" fill="none" stroke="#D68910" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

    <!-- Top Category Badge -->
    <g transform="translate(175, 52)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#F39C12"/>
        <text x="0" y="5" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HÀNH ĐỘNG TƯƠNG TÁC</text>
    </g>

    <!-- Main Title -->
    <text x="175" y="105" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#7E5109" text-anchor="middle">CÚI XUỐNG &amp; BẮT LẤY</text>

    <!-- Subtitle (Small helper for parents) -->
    <text x="175" y="128" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7F8C8D" text-anchor="middle">Gắp đồ vật/kho báu trên ô gạch</text>

    <!-- Center Illustration Area -->
    <g id="illustration">
        
            <g transform="translate(175, 225)">
                <!-- Robot Claw Grabber -->
                <path d="M -30,-80 L 30,-80 L 15,-20 L -15,-20 Z" fill="#BDC3C7" stroke="#7F8C8D" stroke-width="4"/>
                <!-- Left Arm -->
                <path d="M -15,-20 Q -55,10 -35,45 Q -25,25 -5,10" fill="#F39C12" stroke="#B9770E" stroke-width="4"/>
                <!-- Right Arm -->
                <path d="M 15,-20 Q 55,10 35,45 Q 25,25 5,10" fill="#F39C12" stroke="#B9770E" stroke-width="4"/>
                <!-- Star inside claw -->
                <polygon points="0,20 8,38 28,38 12,50 18,70 0,58 -18,70 -12,50 -28,38 -8,38" fill="#F1C40F" stroke="#D68910" stroke-width="3"/>
                <!-- Down Motion arrows -->
                <path d="M -60,-30 L -60,0" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
                <polyline points="-68,-10 -60,0 -52,-10" fill="none" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
                <path d="M 60,-30 L 60,0" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
                <polyline points="52,-10 60,0 68,-10" fill="none" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
            </g>
        
    </g>

    <!-- Bottom Decorative Floor Tile Grid Hint -->
    <g transform="translate(175, 435)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#D68910" stroke-width="2" opacity="0.8"/>
        <!-- 3 small floor tile squares -->
        <rect x="-35" y="-7" width="14" height="14" rx="2" fill="#F39C12" opacity="0.4"/>
        <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#F39C12"/>
        <rect x="21" y="-7" width="14" height="14" rx="2" fill="#F39C12" opacity="0.4"/>
    </g>
    
    <!-- Little footprint footer -->
    <text x="175" y="470" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#95A5A6" text-anchor="middle" letter-spacing="1">KHU VƯỜN LẬP TRÌNH TÍ HON</text>
</svg>
