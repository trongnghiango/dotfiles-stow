<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="350" height="500">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <!-- Outer Card Background with Rounded Corner -->
    <rect x="15" y="15" width="320" height="470" rx="28" fill="#FEFDE8" stroke="#27AE60" stroke-width="7" filter="url(#shadow)"/>
    
    <!-- Inner dashed border (guide for child / friendly look) -->
    <rect x="25" y="25" width="300" height="450" rx="20" fill="none" stroke="#27AE60" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

    <!-- Top Category Badge -->
    <g transform="translate(175, 52)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#2ECC71"/>
        <text x="0" y="5" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HỒI PHỤC (BONUS)</text>
    </g>

    <!-- Main Title -->
    <text x="175" y="105" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="900" fill="#196F3D" text-anchor="middle">TRẠM NẠP NĂNG LƯỢNG</text>

    <!-- Subtitle (Small helper for parents) -->
    <text x="175" y="128" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#7F8C8D" text-anchor="middle">Đến đây để nạp đầy pin!</text>

    <!-- Center Illustration Area -->
    <g id="illustration">
        
            <g transform="translate(175, 225)">
                <!-- Battery shape -->
                <rect x="-45" y="-60" width="90" height="130" rx="16" fill="#2ECC71" stroke="#27AE60" stroke-width="6"/>
                <rect x="-18" y="-76" width="36" height="16" rx="5" fill="#27AE60"/>
                <!-- Lightning Bolt in center -->
                <polygon points="5,-40 -25,0 0,0 -8,45 25,-5 0,-5" fill="#F1C40F" stroke="#D68910" stroke-width="4"/>
                <!-- Energy sparks -->
                <circle cx="-60" cy="-20" r="6" fill="#F1C40F"/>
                <circle cx="60" cy="10" r="7" fill="#F1C40F"/>
            </g>
        
    </g>

    <!-- Bottom Decorative Floor Tile Grid Hint -->
    <g transform="translate(175, 435)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#27AE60" stroke-width="2" opacity="0.8"/>
        <!-- 3 small floor tile squares -->
        <rect x="-35" y="-7" width="14" height="14" rx="2" fill="#2ECC71" opacity="0.4"/>
        <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#2ECC71"/>
        <rect x="21" y="-7" width="14" height="14" rx="2" fill="#2ECC71" opacity="0.4"/>
    </g>
    
    <!-- Little footprint footer -->
    <text x="175" y="470" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#95A5A6" text-anchor="middle" letter-spacing="1">KHU VƯỜN LẬP TRÌNH TÍ HON</text>
</svg>
