<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="350" height="500">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <!-- Outer Card Background with Rounded Corner -->
    <rect x="15" y="15" width="320" height="470" rx="28" fill="#EBF5FB" stroke="#2980B9" stroke-width="7" filter="url(#shadow)"/>
    
    <!-- Inner dashed border (guide for child / friendly look) -->
    <rect x="25" y="25" width="300" height="450" rx="20" fill="none" stroke="#2980B9" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

    <!-- Top Category Badge -->
    <g transform="translate(175, 52)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#5DADE2"/>
        <text x="0" y="5" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VẬT CẢN (OBSTACLE)</text>
    </g>

    <!-- Main Title -->
    <text x="175" y="105" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="900" fill="#1B4F72" text-anchor="middle">VŨNG NƯỚC SÂU</text>

    <!-- Subtitle (Small helper for parents) -->
    <text x="175" y="128" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#7F8C8D" text-anchor="middle">Nhảy qua hoặc đi vòng!</text>

    <!-- Center Illustration Area -->
    <g id="illustration">
        
            <g transform="translate(175, 225)">
                <!-- Water Puddle -->
                <path d="M -70,10 Q -80,50 0,55 Q 75,55 70,15 Q 65,-30 10,-35 Q -40,-40 -70,10 Z" fill="#5DADE2" stroke="#2980B9" stroke-width="6"/>
                <!-- Water Ripple -->
                <ellipse cx="0" cy="15" rx="35" ry="15" fill="none" stroke="#AED6F1" stroke-width="4"/>
                <ellipse cx="-10" cy="10" rx="15" ry="6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
                <!-- Water Drops -->
                <path d="M -40,-50 Q -35,-35 -40,-30 Q -45,-35 -40,-50 Z" fill="#3498DB"/>
                <path d="M 35,-60 Q 40,-45 35,-40 Q 30,-45 35,-60 Z" fill="#3498DB"/>
            </g>
        
    </g>

    <!-- Bottom Decorative Floor Tile Grid Hint -->
    <g transform="translate(175, 435)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#2980B9" stroke-width="2" opacity="0.8"/>
        <!-- 3 small floor tile squares -->
        <rect x="-35" y="-7" width="14" height="14" rx="2" fill="#5DADE2" opacity="0.4"/>
        <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#5DADE2"/>
        <rect x="21" y="-7" width="14" height="14" rx="2" fill="#5DADE2" opacity="0.4"/>
    </g>
    
    <!-- Little footprint footer -->
    <text x="175" y="470" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#95A5A6" text-anchor="middle" letter-spacing="1">KHU VƯỜN LẬP TRÌNH TÍ HON</text>
</svg>
