# KaOS-CS /etc/mkinitcpio.conf
# Btrfs + LVM + encryption support with snapper snapshots

MODULES=(btrfs crc32c-intel)

BINARIES=()

FILES=()

# HOOKS order is critical:
# base udev autodetect microcode modconf kms keyboard keymap consolefont block encrypt lvm2 filesystems fsck
# For Btrfs root with snapshots, we need btrfs in filesystems hook (built-in)
# The 'btrfs' module is loaded via MODULES above

HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block encrypt lvm2 filesystems fsck)

# COMPRESSION
# Use zstd for faster boot
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -3)

# Add snapper snapshot support to initramfs (optional, for rollback from boot menu)
# This is handled by grub-btrfs, not needed in initramfs