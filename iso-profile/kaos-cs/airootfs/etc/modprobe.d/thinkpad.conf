# KaOS-CS ThinkPad X230/T480 hardware optimizations

# Intel HD 4000 / UHD 620 - enable RC6 and framebuffer compression
options i915 enable_rc6=1 enable_fbc=1 lvds_downclock=1 semaphores=1

# ThinkPad ACPI - fan control, keyboard backlight, battery thresholds
options thinkpad_acpi fan_control=1 brightness_enable=1

# Intel P-state - use active mode with HWP
options intel_pstate=active

# NVMe - disable APST for better latency on older drives
options nvme_core default_ps_max_latency_us=0

# USB autosuspend for power savings
options usbcore autosuspend=1

# Audio - HD Audio power saving
options snd_hda_intel power_save=1 power_save_controller=Y

# Disable PC speaker beep
blacklist pcspkr

# Bluetooth - enable experimental features for better battery
# options btusb enable_autosuspend=1