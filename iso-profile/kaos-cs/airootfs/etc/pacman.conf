# KaOS-CS /etc/pacman.conf
# Based on Arch Linux default with KaOS-CS optimizations

[options]
# General
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
ILoveCandy
VerbosePkgLists

# SigLevel
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repositories
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# [community] - merged into extra in 2023

# KaOS-CS custom repository (if needed)
# [kaos-cs]
# SigLevel = Optional TrustAll
# Server = https://github.com/trongnghiango/dotfiles-stow/releases/download/packages/

# AUR helper (yay) will handle AUR packages
# No AUR repo in pacman.conf by default