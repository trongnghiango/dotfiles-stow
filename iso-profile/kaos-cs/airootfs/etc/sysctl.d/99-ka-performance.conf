# KaOS-CS Kernel Sysctl Tuning
# Optimized for ThinkPad X230/T480 (older hardware, limited RAM)

# Virtual Memory - optimized for zRAM swap
vm.swappiness = 180
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1000

# Page cluster - optimize for zRAM (single page reads/writes)
vm.page-cluster = 0

# Overcommit - allow reasonable overcommit for containers
vm.overcommit_memory = 1
vm.overcommit_ratio = 50

# Min free kbytes - keep some reserve for network/IO
vm.min_free_kbytes = 65536

# Network - TCP Fast Open, BBR congestion control
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_codel

# Network buffers - increase for better throughput
net.core.rmem_max = 2500000
net.core.wmem_max = 2500000
net.ipv4.tcp_rmem = 4096 87380 6291456
net.ipv4.tcp_wmem = 4096 65536 6291456

# Security - basic hardening
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.perf_event_paranoid = 3
kernel.yama.ptrace_scope = 1
vm.unprivileged_userfaultfd = 0

# Filesystem - inotify limits for development tools
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Core dumps - disable by default (enabled via systemd-coredump if needed)
kernel.core_pattern = |/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %e