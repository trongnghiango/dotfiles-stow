DEFAULT KaOS-CS
PROMPT 0
TIMEOUT 300

LABEL KaOS-CS
    MENU LABEL KaOS-CS (Live)
    LINUX /vmlinuz-linux-lts
    INITRD /intel-ucode.img,/initramfs-linux-lts.img
    APPEND root=/dev/disk/by-label/KAOS_CS rw quiet loglevel=3

LABEL KaOS-CS-fallback
    MENU LABEL KaOS-CS (Live Fallback)
    LINUX /vmlinuz-linux-lts
    INITRD /intel-ucode.img,/initramfs-linux-lts-fallback.img
    APPEND root=/dev/disk/by-label/KAOS_CS rw quiet loglevel=3